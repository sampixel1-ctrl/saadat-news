<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   minimum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>کانال تلگرام | بازرگانی سعادت</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;

            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {

            min-height: 100vh;
            min-height: 100dvh;

            font-family: Tahoma, Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(34, 158, 217, 0.16),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(34, 158, 217, 0.12),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #ffffff,
                    #eeeeee
                );
        }


        /* افکت های پس زمینه */

        .shape {
            position: fixed;

            z-index: 0;

            pointer-events: none;

            border-radius: 50%;

            background: rgba(34, 158, 217, 0.08);

            filter: blur(5px);
        }

        .shape-one {
            width: 260px;
            height: 260px;

            top: -120px;
            right: -100px;
        }

        .shape-two {
            width: 300px;
            height: 300px;

            bottom: -160px;
            left: -120px;
        }


        /* کارت اصلی */

        .container {

            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 400px;

            padding: 42px 25px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.60);

            border: 1px solid rgba(255,255,255,0.90);

            border-radius: 30px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.12),
                inset 0 1px 1px rgba(255,255,255,0.9);
        }


        /* لوگوی تلگرام */

        .telegram-logo {

            width: 125px;
            height: 125px;

            margin: 0 auto 27px;

            border-radius: 30px;

            background-image:
                url("telegram-logo.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            box-shadow:
                0 16px 35px rgba(34,158,217,0.28);

            border: 3px solid rgba(255,255,255,0.90);
        }


        /* عنوان */

        h1 {

            font-size: 25px;

            color: #222;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .brand {

            color: #229ED9;
        }


        /* دکمه ورود */

        .telegram-button {

            width: 100%;

            min-height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 17px;

            text-decoration: none;

            color: white;

            font-size: 17px;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #229ED9,
                    #168AC3
                );

            box-shadow:
                0 12px 28px rgba(34,158,217,0.30);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .telegram-button:active {

            transform: scale(0.97);

            box-shadow:
                0 6px 14px rgba(34,158,217,0.22);
        }


        /* متن زیر دکمه */

        .subtitle {

            margin-top: 22px;

            color: #666;

            font-size: 14px;

            line-height: 2;
        }


        /* پایین صفحه */

        .footer {

            margin-top: 25px;

            color: #aaa;

            font-size: 10px;
        }


        /* گوشی های کوچک */

        @media (max-height: 700px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 30px 20px 22px;
            }

            .telegram-logo {

                width: 95px;
                height: 95px;

                margin-bottom: 20px;

                border-radius: 24px;
            }

            h1 {

                font-size: 22px;

                margin-bottom: 20px;
            }

            .telegram-button {

                min-height: 52px;

                font-size: 15px;
            }

            .subtitle {

                margin-top: 17px;
            }

            .footer {

                margin-top: 18px;
            }
        }

    </style>

</head>


<body>


    <!-- افکت های پس زمینه -->

    <div class="shape shape-one"></div>

    <div class="shape shape-two"></div>


    <!-- کارت اصلی -->

    <main class="container">


        <!-- لوگوی تلگرام -->

        <div class="telegram-logo"></div>


        <!-- عنوان -->

        <h1>

            کانال تلگرام

            <span class="brand">
                بازرگانی سعادت
            </span>

        </h1>


        <!-- دکمه ورود به کانال -->

        <a
            href="https://t.me/Saadatpakhsh1"
            class="telegram-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            ورود به کانال
        </a>


        <!-- توضیحات -->

        <p class="subtitle">

            جدیدترین اخبار و اطلاعات محصولات

        </p>


        <!-- نام مجموعه -->

        <div class="footer">

            Saadat Trading Group

        </div>


    </main>


</body>

</html>
