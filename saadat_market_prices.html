<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>قیمت ارز، طلا و سکه | بازرگانی سعادت</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      padding: 12px 8px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .status {
      text-align: center;
      color: #777777;
      font-size: 11px;
      margin: 0 0 10px;
      min-height: 17px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
      width: 100%;
    }

    .card {
      width: 100%;
      min-width: 0;
      height: 102px;
      padding: 10px 14px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      background: #f41443;
      border-radius: 29px;
      color: #ffffff;
      overflow: hidden;
    }

    .logo {
      width: 47px;
      height: 47px;
      flex: 0 0 47px;
      border-radius: 50%;
      background: #073cff;
    }

    .info {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .name {
      font-size: clamp(13px, 2.9vw, 21px);
      font-weight: bold;
      line-height: 1.5;
      white-space: nowrap;
    }

    .price {
      margin-top: 2px;
      font-size: clamp(15px, 3.5vw, 24px);
      font-weight: bold;
      line-height: 1.5;
      white-space: nowrap;
      direction: rtl;
    }

    .price.loading {
      font-size: 15px;
    }

    .up {
      color: #caffdc;
    }

    .down {
      color: #ffe0e0;
    }

    .footer {
      text-align: center;
      color: #888888;
      font-size: 10px;
      margin-top: 14px;
      line-height: 1.8;
    }

    @media (max-width: 380px) {
      body {
        padding: 10px 6px;
      }

      .grid {
        gap: 10px 8px;
      }

      .card {
        height: 90px;
        padding: 8px 8px;
        gap: 6px;
        border-radius: 23px;
      }

      .logo {
        width: 35px;
        height: 35px;
        flex-basis: 35px;
      }

      .name {
        font-size: 12px;
      }

      .price {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div id="status" class="status">در حال دریافت قیمت‌ها...</div>
    <section id="prices" class="grid"></section>
    <div class="footer">قیمت‌ها به تومان · منبع: TGJU</div>
  </main>

  <script>
    const items = [
      { id: "price_dollar_rl", name: "دلار" },
      { id: "price_eur", name: "یورو" },
      { id: "sekeb", name: "سکه تمام قدیم" },
      { id: "sekee", name: "سکه تمام جدید" },
      { id: "geram18", name: "طلا ۱۸ عیار" },
      { id: "geram24", name: "طلا ۲۴ عیار" }
    ];

    const previousPrices = {};
    let updating = false;

    function formatPrice(value) {
      return Math.round(value / 10).toLocaleString("en-US")
        + " تومان";
    }

    function createCards() {
      document.getElementById("prices").innerHTML =
        items.map(item => `
          <article class="card" id="card-${item.id}">
            <div class="logo" aria-hidden="true"></div>
            <div class="info">
              <div class="name">${item.name}</div>
              <div class="price loading">در حال دریافت...</div>
            </div>
          </article>
        `).join("");
    }

    function updateCard(item, data) {
      const value = Number(data.p);
      if (!Number.isFinite(value) || value <= 0) return false;

      const element = document.querySelector(
        "#card-" + item.id + " .price"
      );
      if (!element) return false;

      const oldValue = previousPrices[item.id];
      element.className = "price";

      if (oldValue !== undefined) {
        if (value > oldValue) element.classList.add("up");
        else if (value < oldValue) element.classList.add("down");
      }

      element.textContent = formatPrice(value);
      previousPrices[item.id] = value;
      return true;
    }

    async function updatePrices() {
      if (updating) return;
      updating = true;

      const status = document.getElementById("status");
      status.textContent = "در حال به‌روزرسانی قیمت‌ها...";

      try {
        const keys = items.map(item => item.id).join(",");
        const url =
          "https://api.tgju.org/v1/widget/tmp?keys=" +
          encodeURIComponent(keys) + "&_=" + Date.now();

        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const result = await response.json();
        const indicators = result?.response?.indicators;

        if (!Array.isArray(indicators)) {
          throw new Error("Invalid response");
        }

        const byName = {};
        indicators.forEach(entry => {
          byName[entry.name] = entry;
        });

        let received = 0;

        items.forEach(item => {
          if (byName[item.id] && updateCard(item, byName[item.id])) {
            received++;
          }
        });

        const time = new Date().toLocaleTimeString("fa-IR");
        status.textContent = received === 6
          ? "آخرین به‌روزرسانی: " + time
          : "دریافت " + received + " از ۶ قیمت · " + time;

      } catch (error) {
        status.textContent = "دریافت قیمت ناموفق بود";
        console.error("TGJU:", error);
      } finally {
        updating = false;
      }
    }

    createCards();
    updatePrices();
    setInterval(updatePrices, 60000);
  </script>
</body>
</html>
