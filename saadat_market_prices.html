<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>قیمت لحظه‌ای بازار</title>

<style>

* {
  box-sizing: border-box;
}


body {

  margin:0;
  padding:12px;

  background:#f4f5f8;

  font-family:Tahoma, Arial, sans-serif;

  direction:rtl;

}



/* شبکه کارت‌ها */

.grid {

  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:12px;

  width:100%;

  max-width:600px;

  margin:auto;

}



/* کارت قیمت */

.card {

  position:relative;

  width:100%;

  min-width:0;

  aspect-ratio:1092 / 360;


  background:#ffffff;


  border-radius:22px;


  overflow:hidden;


  box-shadow:

  0 6px 18px rgba(0,0,0,0.12);


  border:1px solid #f2d7e3;

}



/* محتوا */

.info {

  position:absolute;

  top:50%;

  right:8%;

  left:8%;

  transform:translateY(-50%);

  text-align:center;

}



/* نام */

.name {

  font-size:clamp(10px,2.8vw,14px);

  font-weight:bold;

  color:#333;

  margin-bottom:8px;

  white-space:nowrap;

}



/* قیمت */

.price {

  font-size:clamp(12px,3.2vw,17px);

  font-weight:bold;

  color:#c90055;

  white-space:nowrap;

}



/* افزایش */

.up {

 color:#079447;

}


/* کاهش */

.down {

 color:#e32636;

}



@media(max-width:350px){


body{

padding:7px;

}


.grid{

gap:8px;

}


.name{

font-size:10px;

}


.price{

font-size:11px;

}


}


</style>


</head>


<body>



<div class="grid">



<!-- دلار -->

<div class="card">

<div class="info">

<div class="name">
دلار آمریکا
</div>

<div class="price" id="usd">
در حال دریافت...
</div>

</div>

</div>





<!-- یورو -->

<div class="card">

<div class="info">

<div class="name">
یورو
</div>

<div class="price" id="eur">
در حال دریافت...
</div>

</div>

</div>





<!-- سکه -->

<div class="card">

<div class="info">

<div class="name">
سکه تمام طرح جدید
</div>

<div class="price" id="coin">
در حال دریافت...
</div>

</div>

</div>





<!-- طلا -->

<div class="card">

<div class="info">

<div class="name">
طلای ۱۸ عیار
</div>

<div class="price" id="gold18">
در حال دریافت...
</div>

</div>

</div>



</div>





<script>



const API =

"https://api.tgju.org/v1/widget/tmp?keys=price_dollar_rl,price_eur,sekee,geram18";





const items = {


price_dollar_rl:"usd",

price_eur:"eur",

sekee:"coin",

geram18:"gold18"


};





const previousPrices={};





function formatPrice(value){


return Math.round(value)

.toLocaleString("en-US")

+" تومان";


}





async function updatePrices(){


try{


const response = await fetch(API,{

cache:"no-store"

});



if(!response.ok){

throw new Error();

}



const data = await response.json();


const indicators=data.response.indicators;





for(const item of indicators){



const id=items[item.name];



if(!id || item.p==null)

continue;





const rawPrice=Number(

String(item.p).replace(/,/g,"")

);





if(!Number.isFinite(rawPrice))

continue;





// ریال به تومان

const price=rawPrice/10;





const element=document.getElementById(id);



element.textContent=formatPrice(price);



element.classList.remove(
"up",
"down"
);





if(previousPrices[item.name]!==undefined){



if(price>previousPrices[item.name]){


element.classList.add("up");


}



else if(price<previousPrices[item.name]){


element.classList.add("down");


}


}





previousPrices[item.name]=price;



}



}

catch(error){


console.log("خطا در دریافت قیمت");


}



}





// بار اول

updatePrices();




// هر یک دقیقه

setInterval(()=>{


updatePrices();


},60000);



</script>


</body>

</html>
