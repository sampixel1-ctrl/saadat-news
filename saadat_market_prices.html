<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قیمت لحظه‌ای بازار | بازرگانی سعادت</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #101b2b;
      color: #f5f7ff;
      font-family: Tahoma, Arial, sans-serif;
    }

    .panel {
      max-width: 1100px;
      margin: 15px auto;
      padding: 18px;
      background: #071321;
      border: 1px solid #244664;
      border-radius: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid #244664;
    }

    h1 {
      margin: 0;
      color: #ff9d24;
      font-size: 22px;
    }

    #status {
      color: #9fcaff;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding-top: 18px;
    }

    .card {
      min-width: 0;
      padding: 22px 10px;
      text-align: center;
      border: 1px solid #244664;
      border-radius: 13px;
      background: linear-gradient(145deg, #0d1d2d, #071321);
    }

    .symbol {
      color: #ff9d24;
      font-size: 30px;
    }

    .name {
      margin: 14px 0;
      color: #a9ccef;
      font-weight: bold;
      font-size: 14px;
    }

    .price {
      direction: ltr;
      overflow-wrap: anywhere;
      margin: 18px 0 8px;
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: bold;
      transition: color .3s;
    }

    .up { color: #20d99a; }
    .down { color: #ff555d; }
    .same { color: #f5f7ff; }

    .unit {
      color: #8298b2;
      font-size: 12px;
    }

    footer {
      margin-top: 20px;
      color: #8298b2;
      text-align: center;
      font-size: 12px;
      line-height: 2;
    }

    @media (max-width: 700px) {
      body { padding: 8px; }
      .panel { padding: 12px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .card { padding: 17px 7px; }
      h1 { font-size: 19px; }
    }

    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="panel">
    <header>
      <h1>قیمت لحظه‌ای بازار</h1>
      <div id="status">در حال دریافت قیمت‌ها...</div>
    </header>

    <section class="grid" id="prices"></section>

    <footer>
      منبع قیمت‌ها: TGJU<br>
      قیمت‌ها به تومان نمایش داده می‌شوند · به‌روزرسانی هر ۶۰ ثانیه
    </footer>
  </main>

  <script>
    const items = [
      { id: "price_dollar_rl", name: "دلار", symbol: "$" },
      { id: "price_eur", name: "یورو", symbol: "€" },
      { id: "sekeb", name: "سکه بهار آزادی (قدیم)", symbol: "◉" },
      { id: "sekee", name: "سکه امامی (جدید)", symbol: "◎" },
      { id: "geram18", name: "طلای ۱۸ عیار", symbol: "◆" },
      { id: "geram24", name: "طلای ۲۴ عیار", symbol: "◆" }
    ];

    const previousPrices = {};

    function formatPrice(value) {
      return (value / 10).toLocaleString("en-US", {
        maximumFractionDigits: 2
      });
    }

    function createCards() {
      document.getElementById("prices").innerHTML = items.map(item => `
        <article class="card" id="card-${item.id}">
          <div class="symbol">${item.symbol}</div>
          <div class="name">${item.name}</div>
          <div class="price same">در حال دریافت...</div>
          <div class="unit">تومان</div>
        </article>
      `).join("");
    }

    function updateCard(item, data) {
      const value = Number(data.p);

      if (!Number.isFinite(value) || value <= 0) return;

      const priceElement = document.querySelector(
        "#card-" + item.id + " .price"
      );

      if (!priceElement) return;

      const oldValue = previousPrices[item.id];

      if (oldValue !== undefined) {
        if (value > oldValue) {
          priceElement.className = "price up";
        } else if (value < oldValue) {
          priceElement.className = "price down";
        }
      } else {
        priceElement.className = "price same";
      }

      priceElement.textContent = formatPrice(value);

      previousPrices[item.id] = value;
    }

    async function updatePrices() {
      const status = document.getElementById("status");
      status.textContent = "در حال به‌روزرسانی...";

      try {
        const keys = items.map(item => item.id).join(",");
        const url =
          "https://api.tgju.org/v1/widget/tmp?keys=" +
          encodeURIComponent(keys) +
          "&_=" + Date.now();

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const result = await response.json();
        const indicators = result?.response?.indicators;

        if (!Array.isArray(indicators)) {
          throw new Error("پاسخ قیمت نامعتبر است");
        }

        const dataByName = {};
        indicators.forEach(entry => {
          dataByName[entry.name] = entry;
        });

        let received = 0;

        items.forEach(item => {
          const data = dataByName[item.id];

          if (data && Number(data.p) > 0) {
            updateCard(item, data);
            received++;
          }
        });

        const time = new Date().toLocaleTimeString("fa-IR");

        if (received === items.length) {
          status.textContent = "● آنلاین · آخرین بررسی: " + time;
        } else {
          status.textContent =
            "دریافت " + received + " از ۶ قیمت · " + time;
        }

      } catch (error) {
        status.textContent = "خطا در دریافت قیمت؛ اتصال را بررسی کنید.";
        console.error("TGJU price update error:", error);
      }
    }

    createCards();
    updatePrices();
    setInterval(updatePrices, 60000);
  </script>
</body>
</html>
