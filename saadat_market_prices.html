<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قیمت‌های لحظه‌ای بازار | بازرگانی سعادت</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #101b2b;
      color: #f5f7ff;
      font-family: Tahoma, Arial, sans-serif;
    }
    .panel {
      max-width: 1200px;
      margin: 20px auto;
      padding: 18px;
      border: 1px solid #244664;
      border-radius: 16px;
      background: #071321;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 4px 18px;
      border-bottom: 1px solid #244664;
    }
    h1 { margin: 0; color: #ff9d24; font-size: 23px; }
    #status { color: #9fcaff; font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding-top: 18px;
    }
    .card {
      text-align: center;
      padding: 22px 10px;
      border: 1px solid #244664;
      border-radius: 13px;
      background: linear-gradient(145deg, #0d1d2d, #071321);
      min-width: 0;
    }
    .symbol { color: #ff9d24; font-size: 32px; }
    .name { color: #a9ccef; margin: 14px 0; font-weight: bold; }
    .price {
      direction: ltr;
      font-size: clamp(17px, 2.5vw, 25px);
      font-weight: bold;
      overflow-wrap: anywhere;
      margin: 18px 0;
    }
    .change { font-size: 18px; font-weight: bold; }
    .up { color: #20d99a; }
    .down { color: #ff555d; }
    .same { color: #a9ccef; }
    .difference { color: #9fcaff; margin-top: 10px; direction: ltr; }
    footer { text-align: center; color: #8298b2; font-size: 12px; margin-top: 18px; }
    @media (max-width: 700px) {
      body { padding: 8px; }
      .panel { padding: 12px; margin: 8px auto; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .card { padding: 17px 7px; }
      h1 { font-size: 19px; }
    }
    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <h1>🏠 قیمت‌های بازار</h1>
      <div id="status">در حال دریافت قیمت‌ها...</div>
    </header>

    <section class="grid" id="prices">
      <div class="card">در حال بارگذاری قیمت‌ها...</div>
    </section>

    <footer>
      منبع: TGJU · به‌روزرسانی خودکار هر ۶۰ ثانیه
    </footer>
  </main>

  <script>
    const items = [
      { id: "price_dollar_rl", name: "دلار", symbol: "$" },
      { id: "price_eur", name: "یورو", symbol: "€" },
      { id: "sekeb", name: "سکه بهار آزادی (قدیم)", symbol: "◉" },
      { id: "sekee", name: "سکه امامی (جدید)", symbol: "◎" },
      { id: "geram18", name: "طلای ۱۸ عیار", symbol: "◆" },
      { id: "geram24", name: "طلای ۲۴ عیار", symbol: "◆" }
    ];

    const previous = {};
    const names = Object.fromEntries(items.map(x => [x.id, x]));

    function formatNumber(value) {
      return Number(value).toLocaleString("en-US", {
        maximumFractionDigits: 2
      });
    }

    function renderCard(item, data) {
      const value = Number(data.p);
      if (!Number.isFinite(value)) throw new Error("Invalid price");

      const old = previous[item.id];
      let cls = "same";
      let arrow = "●";

      if (old !== undefined) {
        if (value > old) {
          cls = "up";
          arrow = "▲";
        } else if (value < old) {
          cls = "down";
          arrow = "▼";
        }
      }

      const percent = Number(data.dp);
      const diff = Number(data.d);
      const percentText = Number.isFinite(percent)
        ? Math.abs(percent).toLocaleString("fa-IR") + "%"
        : "";
      const diffText = Number.isFinite(diff)
        ? "(" + formatNumber(Math.abs(diff)) + ")"
        : "";

      const card = document.getElementById("card-" + item.id);
      if (!card) return;

      card.querySelector(".price").textContent = formatNumber(value);
      const change = card.querySelector(".change");
      change.className = "change " + cls;
      change.textContent = arrow + (percentText ? " " + percentText : "");
      card.querySelector(".difference").textContent = diffText;

      previous[item.id] = value;
    }

    function createCards() {
      document.getElementById("prices").innerHTML = items.map(item => `
        <article class="card" id="card-${item.id}">
          <div class="symbol">${item.symbol}</div>
          <div class="name">${item.name}</div>
          <div class="price">—</div>
          <div class="change same">● منتظر قیمت</div>
          <div class="difference"></div>
        </article>
      `).join("");
    }

    async function updatePrices() {
      const status = document.getElementById("status");
      status.textContent = "در حال به‌روزرسانی...";

      try {
        const keys = items.map(x => x.id).join(",");
        const url = "https://api.tgju.org/v1/widget/tmp?keys=" +
          encodeURIComponent(keys);

        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("API error");

        const result = await response.json();
        const indicators = result?.response?.indicators;

        if (!Array.isArray(indicators)) throw new Error("Invalid data");

        const dataByName = {};
        indicators.forEach(entry => {
          dataByName[entry.name] = entry;
        });

        items.forEach(item => {
          if (dataByName[item.id]) {
            renderCard(item, dataByName[item.id]);
          }
        });

        const missing = items.some(item => !dataByName[item.id]);
        const now = new Date().toLocaleTimeString("fa-IR");
        status.textContent = (missing ? "برخی قیمت‌ها دریافت نشدند · " : "● آنلاین · ")
          + "آخرین به‌روزرسانی: " + now;
      } catch (error) {
        status.textContent = "دریافت قیمت ناموفق بود؛ اتصال را بررسی کنید.";
      }
    }

    createCards();
    updatePrices();
    setInterval(updatePrices, 60000);
  </script>
</body>
</html>
