<body>
  <main class="container">

    <header class="header">
      <div class="brand">بازرگانی سعادت</div>
      <h1>قیمت روز بازار</h1>
      <div class="subtitle">نرخ ارز، طلا و سکه</div>

      <div class="status-bar">
        <span id="statusDot" class="status-dot"></span>
        <span id="status">در حال دریافت قیمت‌ها...</span>
      </div>
    </header>

    <div class="section-title">قیمت‌های لحظه‌ای</div>

    <section class="grid" id="prices">
      <article class="card">
        <div class="name">در حال بارگذاری...</div>
      </article>
    </section>

    <footer class="footer">
      تمامی قیمت‌ها به تومان هستند.<br>
      منبع اطلاعات: TGJU<br>
      بررسی خودکار قیمت‌ها هر ۶۰ ثانیه
    </footer>

  </main>

  <script>
    const items = [
      {
        id: "price_dollar_rl",
        name: "دلار آمریکا",
        icon: "$"
      },
      {
        id: "price_eur",
        name: "یورو",
        icon: "€"
      },
      {
        id: "sekeb",
        name: "سکه بهار آزادی (قدیم)",
        icon: "◉"
      },
      {
        id: "sekee",
        name: "سکه امامی (جدید)",
        icon: "◎"
      },
      {
        id: "geram18",
        name: "طلای ۱۸ عیار",
        icon: "◆"
      },
      {
        id: "geram24",
        name: "طلای ۲۴ عیار",
        icon: "✦"
      }
    ];

    const previousPrices = {};
    let updating = false;

    function formatPrice(value) {
      return (value / 10).toLocaleString("en-US", {
        maximumFractionDigits: 2
      });
    }

    function createCards() {
      const grid = document.getElementById("prices");

      grid.innerHTML = items.map(item => `
        <article class="card" id="card-${item.id}">
          <div class="icon">${item.icon}</div>
          <div class="name">${item.name}</div>
          <div class="price same">---</div>
          <div class="unit">تومان</div>
        </article>
      `).join("");
    }

    function updateCard(item, data) {
      const value = Number(data.p);

      if (!Number.isFinite(value) || value <= 0) {
        return false;
      }

      const element = document.querySelector(
        "#card-" + item.id + " .price"
      );

      if (!element) {
        return false;
      }

      const oldValue = previousPrices[item.id];

      if (oldValue !== undefined) {
        if (value > oldValue) {
          element.className = "price up";
        } else if (value < oldValue) {
          element.className = "price down";
        }
      } else {
        element.className = "price same";
      }

      element.textContent = formatPrice(value);
      previousPrices[item.id] = value;

      return true;
    }

    async function updatePrices() {
      if (updating) return;

      updating = true;

      const status = document.getElementById("status");
      const dot = document.getElementById("statusDot");

      status.textContent = "در حال به‌روزرسانی...";
      dot.className = "status-dot";

      try {
        const keys = items.map(item => item.id).join(",");

        const url =
          "https://api.tgju.org/v1/widget/tmp?keys=" +
          encodeURIComponent(keys) +
          "&_=" + Date.now();

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const result = await response.json();
        const indicators = result?.response?.indicators;

        if (!Array.isArray(indicators)) {
          throw new Error("Invalid response");
        }

        const dataByName = {};

        indicators.forEach(entry => {
          dataByName[entry.name] = entry;
        });

        let received = 0;

        items.forEach(item => {
          if (
            dataByName[item.id] &&
            updateCard(item, dataByName[item.id])
          ) {
            received++;
          }
        });

        const time = new Date().toLocaleTimeString("fa-IR");

        if (received === items.length) {
          status.textContent = "آخرین بررسی: " + time;
          dot.className = "status-dot online";
        } else {
          status.textContent =
            received + " از ۶ قیمت دریافت شد · " + time;
          dot.className = "status-dot error";
        }

      } catch (error) {
        status.textContent =
          "دریافت قیمت ناموفق بود؛ اتصال را بررسی کنید.";
        dot.className = "status-dot error";
        console.error("TGJU update error:", error);

      } finally {
        updating = false;
      }
    }

    createCards();
    updatePrices();
    setInterval(updatePrices, 60000);
  </script>
</body>
</html>
