<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قیمت لحظه‌ای بازار</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #f4f5f8;
  font-family: Tahoma, Arial, sans-serif;
  direction: rtl;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  justify-items: center;
}

.card {
  position: relative;
  width: 110%;
  min-width: 0;
  aspect-ratio: 1092 / 360;
  overflow: hidden;

  background-image: url("https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/price-cards.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
}

.info {
  position: absolute;
  right: 8%;
  left: 8%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  min-width: 0;
}

.name {
  font-size: clamp(10px, 2.8vw, 14px);
  font-weight: bold;
  color: #333;
  margin-bottom: 5px;
  white-space: nowrap;
}

.price {
  font-size: clamp(11px, 3.1vw, 16px);
  font-weight: bold;
  direction: rtl;
  white-space: nowrap;
  color: #333;
}

.up {
  color: #079447;
}

.down {
  color: #e32636;
}

.status {
  text-align: center;
  color: #777;
  font-size: 10px;
  margin-top: 14px;
}

@media (max-width: 350px) {
  body {
    padding: 7px;
  }

  .grid {
    gap: 7px;
  }

  .card {
    height: 80px;
  }

  .name {
    font-size: 10px;
  }

  .price {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="grid">

  <!-- دلار -->
  <div class="card">
    <div class="info">
      <div class="name">دلار آمریکا</div>
      <div class="price" id="usd">در حال دریافت...</div>
    </div>
  </div>

  <!-- یورو -->
  <div class="card">
    <div class="info">
      <div class="name">یورو</div>
      <div class="price" id="eur">در حال دریافت...</div>
    </div>
  </div>

  <!-- سکه تمام طرح جدید -->
  <div class="card">
    <div class="info">
      <div class="name">سکه تمام طرح جدید</div>
      <div class="price" id="coin">در حال دریافت...</div>
    </div>
  </div>

  <!-- طلای ۱۸ عیار -->
  <div class="card">
    <div class="info">
      <div class="name">طلای ۱۸ عیار</div>
      <div class="price" id="gold18">در حال دریافت...</div>
    </div>
  </div>

</div>

<div class="status" id="status">
  در حال اتصال به سرور قیمت‌ها...
</div>

<script>

const API =
  "https://api.tgju.org/v1/widget/tmp?keys=price_dollar_rl,price_eur,sekee,geram18";

const items = {
  price_dollar_rl: "usd",
  price_eur: "eur",
  sekee: "coin",
  geram18: "gold18"
};

const previousPrices = {};

function formatPrice(value) {
  return Math.round(value).toLocaleString("en-US") + " تومان";
}

async function updatePrices() {

  const status = document.getElementById("status");

  try {

    const response = await fetch(API, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("خطا در دریافت اطلاعات");
    }

    const data = await response.json();
    const indicators = data.response.indicators;

    for (const item of indicators) {

      const elementId = items[item.name];

      if (!elementId || item.p == null) continue;

      const rawPrice = Number(
        String(item.p).replace(/,/g, "")
      );

      if (!Number.isFinite(rawPrice)) continue;

      // تبدیل ریال به تومان
      const price = rawPrice / 10;

      const element = document.getElementById(elementId);

      element.textContent = formatPrice(price);

      element.classList.remove("up", "down");

      // تشخیص افزایش یا کاهش قیمت
      if (previousPrices[item.name] !== undefined) {

        if (price > previousPrices[item.name]) {
          element.classList.add("up");

        } else if (price < previousPrices[item.name]) {
          element.classList.add("down");
        }
      }

      previousPrices[item.name] = price;
    }

    status.textContent =
      "آخرین بروزرسانی: " +
      new Date().toLocaleTimeString("fa-IR");

  } catch (error) {

    status.textContent =
      "دریافت قیمت ناموفق بود؛ اتصال اینترنت را بررسی کنید.";
  }
}


// دریافت اولیه قیمت‌ها
updatePrices();


// بروزرسانی خودکار هر 60 ثانیه
setInterval(() => {
  updatePrices();
}, 60000);

</script>

</body>
</html>
