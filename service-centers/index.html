<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمایندگان خدمات</title>
<style>
body{margin:0;background:#f5f7fb;font-family:tahoma;color:#172033}
.wrap{padding:15px}
.provinces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.province{background:white;border:0;border-radius:15px;padding:18px;font-weight:bold}
.active{background:#172033;color:white}
.card{background:white;border-radius:18px;padding:15px;margin-top:12px}
.brand{display:inline-block;background:#eef2f7;border-radius:20px;padding:6px 10px;margin:3px;font-size:12px}
.name{font-size:17px;font-weight:bold}
.info{line-height:2;margin-top:10px}
.call{display:block;background:#172033;color:white;text-align:center;padding:12px;border-radius:12px;text-decoration:none;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div id="provinces" class="provinces"></div>
<div id="results"></div>
</div>
<script>
let data={provinces:[]},selected="";
fetch("service_centers.json?v="+Date.now()).then(r=>r.json()).then(j=>{data=j;showProvinces()});

function showProvinces(){
 let b=document.getElementById("provinces");
 b.innerHTML="";
 data.provinces.forEach(p=>{
  let x=document.createElement("button");
  x.className="province "+(selected==p.name?"active":"");
  x.innerText=p.name;
  x.onclick=()=>{selected=p.name;showProvinces();showReps()};
  b.appendChild(x);
 });
}
function showReps(){
 let p=data.provinces.find(x=>x.name==selected);
 document.getElementById("results").innerHTML=(p.representatives.length?
 p.representatives.map(r=>`
 <div class="card">
 <div class="name">${r.name}</div>
 <div>${(r.brands||[]).map(x=>`<span class="brand">${x}</span>`).join("")}</div>
 <div class="info">📞 ${r.phone}<br>📍 ${r.address}</div>
 <a class="call" href="tel:${r.phone}">تماس</a>
 </div>`).join(""):
 '<div class="card">نماینده‌ای ثبت نشده است</div>');
}
</script>
</body>
</html>
