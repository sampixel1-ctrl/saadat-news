<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>بنرهای سعادت</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Tahoma,Arial,sans-serif}
#carousel{position:relative;width:100%;height:100%;min-height:90px;overflow:hidden;border-radius:12px;background:#f0f0f0;touch-action:pan-y}
.slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .35s ease;pointer-events:none}
.slide.active{opacity:1}
.slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:rgba(20,20,20,.48);color:#fff;font-size:25px;line-height:36px;text-align:center;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent}
.arrow:active{background:rgba(20,20,20,.72)}
#prev{right:9px}
#next{left:9px}
#dots{position:absolute;z-index:4;left:0;right:0;bottom:7px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dot{width:7px;height:7px;border-radius:8px;background:rgba(70,70,70,.35);border:1px solid rgba(255,255,255,.8)}
.dot.active{width:18px;background:#c72c61}
#message{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:12px;color:#666;font-size:13px}
</style>
</head>
<body>
<div id="carousel" aria-label="بنرهای سعادت">
  <div id="message">اتصال اینترنت را بررسی کنید.</div>
  <button class="arrow" id="prev" type="button" aria-label="بنر قبلی">‹</button>
  <button class="arrow" id="next" type="button" aria-label="بنر بعدی">›</button>
  <div id="dots">
    <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
  </div>
</div>
<script>
(function(){
  // برای به‌روزرسانی بنرها، تصاویر را با همین نام‌ها در GitHub جایگزین کنید.
  var imageUrls = [
    'https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners/banner1.png',
    'https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners/banner2.png',
    'https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners/banner3.png'
  ];
  var root=document.getElementById('carousel');
  var dots=Array.prototype.slice.call(document.querySelectorAll('.dot'));
  var message=document.getElementById('message');
  var prevButton=document.getElementById('prev');
  var nextButton=document.getElementById('next');
  var slides=[], current=0, rotation=null, isPressed=false, touchStartX=0;

  function fresh(url){return url+(url.indexOf('?')>=0?'&':'?')+'refresh='+Date.now();}
  function show(index){
    current=(index+slides.length)%slides.length;
    slides.forEach(function(s,i){s.classList.toggle('active',i===current);});
    dots.forEach(function(d,i){d.classList.toggle('active',i===current);});
  }
  function startTimer(){
    stopTimer();
    if(!isPressed && slides.length>1){
      rotation=setInterval(function(){show(current+1);},5000);
    }
  }
  function stopTimer(){
    if(rotation){clearInterval(rotation);rotation=null;}
  }
  function manualChange(delta){
    if(!slides.length)return;
    show(current+delta);
    // تغییر دستی تایمر را از نو شروع می‌کند، مگر اینکه انگشت هنوز روی بنر باشد.
    startTimer();
  }

  imageUrls.forEach(function(url,index){
    var slide=document.createElement('div');
    slide.className='slide'+(index===0?' active':'');
    var img=document.createElement('img');
    img.alt='بنر سعادت '+(index+1);
    img.draggable=false;
    img.src=fresh(url);
    img.onerror=function(){if(index===0)message.style.display='flex';};
    img.onload=function(){if(index===0)message.style.display='none';};
    slide.appendChild(img);
    root.insertBefore(slide,document.getElementById('dots'));
    slides.push(slide);
  });

  prevButton.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();manualChange(-1);});
  nextButton.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();manualChange(1);});

  // مکث تایمر تا وقتی انگشت/ماوس روی بنر نگه داشته شده است.
  function pressStart(e){
    if(e.target===prevButton || e.target===nextButton)return;
    isPressed=true;
    stopTimer();
  }
  function pressEnd(){
    if(!isPressed)return;
    isPressed=false;
    startTimer();
  }
  root.addEventListener('pointerdown',pressStart);
  window.addEventListener('pointerup',pressEnd);
  window.addEventListener('pointercancel',pressEnd);
  root.addEventListener('pointerleave',function(e){
    // اگر کاربر با ماوس از بنر خارج شد، تایمر از سر گرفته شود.
    if(e.pointerType==='mouse')pressEnd();
  });

  // امکان کشیدن به چپ/راست روی صفحه لمسی
  root.addEventListener('touchstart',function(e){
    touchStartX=e.changedTouches[0].clientX;
  },{passive:true});
  root.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-touchStartX;
    if(Math.abs(dx)>40){
      show(current+(dx<0?1:-1));
      // پس از برداشتن انگشت، تایمر دوباره شروع می‌شود.
      isPressed=false;
      startTimer();
    }
  },{passive:true});

  startTimer();

  // هر ۵ دقیقه تصاویر دوباره بارگذاری می‌شوند تا نسخه‌های جایگزین‌شده در GitHub دریافت شوند.
  setInterval(function(){
    slides.forEach(function(slide,i){
      var img=slide.querySelector('img');
      img.src=fresh(imageUrls[i]);
    });
  },300000);
})();
</script>
</body>
</html>
