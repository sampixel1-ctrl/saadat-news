<script>
(()=>{
const BANNERS_URL='https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners.json';
const NEWS_URL='https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/news.json';
const banner=document.getElementById('banner');let urls=[1,2,3].map(n=>`https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners/banner${n}.png`),i=0,timer=null,held=false;
function start(){clearInterval(timer);if(!held&&urls.length>1)timer=setInterval(()=>{i=(i+1)%urls.length;banner.src=urls[i]},5000)}
function pause(){held=true;clearInterval(timer)}function resume(){held=false;start()}
banner.addEventListener('pointerdown',pause);['pointerup','pointercancel','pointerleave'].forEach(e=>banner.addEventListener(e,resume));banner.addEventListener('contextmenu',e=>e.preventDefault());
fetch(BANNERS_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{const list=[d.banner1,d.banner2,d.banner3].filter(x=>typeof x==='string'&&x);if(list.length){urls=list;i=0;banner.src=urls[0];start()}}).catch(start);
function fmtDate(d){if(!d)return '';const p=String(d).trim().split(/[\/.-]/);return p.length===3&&p[0].length===4?`${p[2].padStart(2,'0')}-${p[1].padStart(2,'0')}-${p[0]}`:String(d).replaceAll('/','-')}
async function loadNews(){try{const r=await fetch(NEWS_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();document.getElementById('notice-heading').textContent=(d.title||'اطلاعیه')+(fmtDate(d.date)?' '+fmtDate(d.date):'');document.getElementById('notice-message').textContent=typeof d.message==='string'?d.message:''}catch(e){document.getElementById('notice-heading').textContent='اطلاعیه';document.getElementById('notice-message').textContent='اطلاعیه در حال حاضر دریافت نشد.'}}
loadNews();setInterval(loadNews,60000);
})();

// Pull down refresh support for mobile Web App / WebView
(()=>{
 let startY=0, pulling=false;
 document.addEventListener('touchstart',e=>{
   if(window.scrollY===0){ startY=e.touches[0].clientY; pulling=true; }
 },{passive:true});
 document.addEventListener('touchend',e=>{
   if(!pulling) return;
   const endY=e.changedTouches[0].clientY;
   if(endY-startY>90){
      location.reload();
   }
   pulling=false;
 },{passive:true});
})();
