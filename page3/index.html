<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8f0648">
<title>بازرگانی سعادت | قیمت محصولات</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f6f5f8;
  color: #28232b;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #39051f, #970849 65%, #c2185b);
  padding: 30px 20px 65px;
  border-radius: 0 0 32px 32px;
  text-align: center;
  color: white;
}

.logo-wrap {
  width: min(100%, 370px);
  height: 115px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-wrap img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.header h1 {
  font-size: 19px;
  margin: 10px 0 7px;
}

.header p {
  font-size: 12px;
  color: #f8dce9;
  margin: 0;
}

.container {
  width: calc(100% - 30px);
  max-width: 480px;
  margin: -38px auto 30px;
  position: relative;
}

.card {
  background: white;
  border-radius: 23px;
  padding: 24px 20px;
  box-shadow: 0 12px 40px rgba(53, 12, 35, .09);
}

.status {
  display: inline-block;
  background: #fce7f1;
  color: #9d174d;
  border-radius: 30px;
  padding: 8px 13px;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 20px;
}

.product-title {
  font-size: 21px;
  font-weight: bold;
  line-height: 1.8;
  margin: 0 0 5px;
}

.code {
  color: #8a8490;
  font-size: 12px;
  margin-bottom: 20px;
  direction: ltr;
  text-align: right;
}

.price-box {
  background: linear-gradient(135deg, #fff1f7, #fce5f0);
  border: 1px solid #f8d1e2;
  border-radius: 18px;
  padding: 19px 15px;
  margin: 18px 0 22px;
}

.price-label {
  font-size: 12px;
  color: #8c4b68;
  margin-bottom: 10px;
}

.price {
  font-size: clamp(25px, 7vw, 34px);
  font-weight: 800;
  color: #a20b51;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.toman {
  font-size: 13px;
  font-weight: normal;
  color: #9b466d;
}

.info {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid #f0edf1;
  font-size: 13px;
  line-height: 1.9;
}

.info-row:last-child { border-bottom: 0; }

.info-label {
  color: #89828c;
  flex-shrink: 0;
}

.info-value {
  font-weight: 600;
  text-align: left;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #99919c;
  font-size: 11px;
  padding: 20px 10px 28px;
  line-height: 2;
}

.maintenance {
  display: none;
  text-align: center;
  padding: 28px 10px;
}

.maintenance-icon {
  width: 65px;
  height: 65px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: #fff0f6;
  color: #a20b51;
  display: grid;
  place-items: center;
  font-size: 30px;
}

.maintenance h2 {
  color: #990848;
  font-size: 18px;
  line-height: 2;
}

.maintenance p {
  color: #77717b;
  font-size: 13px;
  line-height: 2.2;
}

.close {
  display: block;
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 13px;
  background: #970849;
  color: white;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.close:active { transform: scale(.98); }

.loading {
  text-align: center;
  color: #77717b;
  padding: 30px 5px;
  font-size: 13px;
  line-height: 2;
}
</style>
</head>
<body>

<header class="header">
  <div class="logo-wrap">
    <img src="logo.png" alt="لوگوی بازرگانی سعادت">
  </div>
  <h1>بازرگانی سعادت</h1>
  <p>مشاهده قیمت و مشخصات محصولات</p>
</header>

<main class="container">
  <section class="card">
    <div id="product">
      <div class="loading">در حال دریافت اطلاعات محصول...</div>
    </div>

    <div class="maintenance" id="maintenance">
      <div class="maintenance-icon">↻</div>
      <h2>قیمت‌ها در حال بروزرسانی می‌باشد</h2>
      <p>لطفاً دقایقی بعد دوباره امتحان کنید.</p>
    </div>

    <button class="close" onclick="closePage()">بستن پنجره</button>
  </section>

  <footer class="footer">
    بازرگانی سعادت<br>
    اطلاعات قیمت مطابق آخرین لیست ثبت‌شده
  </footer>
</main>

<script>
const productEl = document.getElementById('product');
const maintenanceEl = document.getElementById('maintenance');

function closePage() {
  window.close();
  setTimeout(() => {
    if (history.length > 1) history.back();
  }, 150);
}

function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  }[c]));
}

function showMaintenance() {
  productEl.style.display = 'none';
  maintenanceEl.style.display = 'block';
}

async function loadProduct() {
  try {
    const configResponse = await fetch(
      'maintenance.json?v=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!configResponse.ok) throw new Error('Config error');

    const config = await configResponse.json();

    if (config.maintenance === true) {
      showMaintenance();
      return;
    }

    const id = new URLSearchParams(location.search).get('id');

    if (!id) throw new Error('Missing product ID');

    const response = await fetch(
      'products.json?v=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) throw new Error('Products error');

    const products = await response.json();
    const p = products.find(x => String(x.id) === id);

    if (!p) {
      productEl.innerHTML =
        '<div class="loading">محصول موردنظر پیدا نشد.</div>';
      return;
    }

    const price = Number(p.priceToman || 0)
      .toLocaleString('fa-IR');

    productEl.innerHTML = `
      <div class="status">● قیمت محصول</div>
      <h2 class="product-title">${safe(p.name || p.model || p.code)}</h2>
      <div class="code">${safe(p.code)}</div>

      <div class="price-box">
        <div class="price-label">قیمت فروش</div>
        <div class="price">
          ${price} <span class="toman">تومان</span>
        </div>
      </div>

      <div class="info">
        <div class="info-row">
          <span class="info-label">برند</span>
          <span class="info-value">${safe(p.brand)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">مدل / کد محصول</span>
          <span class="info-value">${safe(p.code)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">توضیحات</span>
          <span class="info-value">${safe(p.description || '—')}</span>
        </div>
        <div class="info-row">
          <span class="info-label">آخرین بروزرسانی</span>
          <span class="info-value">${safe(p.updateDateShamsi || '—')}</span>
        </div>
      </div>
    `;
  } catch (e) {
    showMaintenance();
  }
}

loadProduct();
</script>
</body>
</html>
