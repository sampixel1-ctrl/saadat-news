<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>قیمت محصول</title><style>
body{margin:0;background:#f5f6f8;font-family:Tahoma,Arial,sans-serif;color:#222}.box{max-width:520px;margin:30px auto;padding:22px;background:#fff;border-radius:18px;box-shadow:0 8px 30px #00000012}.title{font-size:20px;font-weight:700;margin-bottom:18px}.row{padding:11px 0;border-bottom:1px solid #eee}.label{color:#777;font-size:13px;margin-bottom:5px}.value{font-size:16px;line-height:1.8}.price{font-size:26px;font-weight:800}.close{margin-top:20px;width:100%;border:0;border-radius:12px;padding:13px;background:#222;color:#fff;font-size:16px;cursor:pointer}.maintenance{text-align:center;padding:28px 10px 20px;font-size:21px;font-weight:800;line-height:2.2}.maintenance small{display:block;margin-top:10px;font-size:15px;font-weight:400;color:#555;line-height:2}</style></head><body><main class="box"><div class="title" id="title">اطلاعات محصول</div><div id="content">در حال دریافت اطلاعات...</div><button class="close" onclick="closePage()">بستن پنجره</button></main><script>
function closePage(){try{window.close()}catch(e){};setTimeout(()=>{if(history.length>1)history.back()},100)}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function cacheBust(file){return file+'?v='+Date.now()}
function showMaintenance(){document.getElementById('title').textContent='';document.getElementById('content').innerHTML='<div class="maintenance">قیمت ها در حال بروز رسانی می باشد<small>لطفا دقایقی بعد دوباره امتحان کنید</small></div>'}
const id=new URLSearchParams(location.search).get('id');
fetch(cacheBust('maintenance.json'),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('maintenance');return r.json()}).then(cfg=>{if(cfg&&cfg.maintenance===true){showMaintenance();return null}return fetch(cacheBust('products.json'),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('products');return r.json()})}).then(items=>{if(!items)return;const p=items.find(x=>x.id===id);if(!p){document.getElementById('content').innerHTML='<div class="row">محصول پیدا نشد.</div>';return}document.getElementById('content').innerHTML='<div class="row"><div class="label">برند</div><div class="value">'+esc(p.brand)+'</div></div><div class="row"><div class="label">مدل / کد</div><div class="value">'+esc(p.code)+'</div></div><div class="row"><div class="label">نام محصول</div><div class="value">'+esc(p.name)+'</div></div><div class="row"><div class="label">توضیحات</div><div class="value">'+esc(p.description)+'</div></div><div class="row"><div class="label">قیمت</div><div class="value price">'+Number(p.priceToman||0).toLocaleString('fa-IR')+' تومان</div></div><div class="row"><div class="label">تاریخ بروزرسانی</div><div class="value">'+esc(p.updateDateShamsi)+'</div></div>'}).catch(()=>showMaintenance());
</script></body></html>
