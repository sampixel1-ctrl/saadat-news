<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>بنرهای سعادت</title>
  <style>
    :root { --accent: #c72c61; --dot: rgba(35,35,35,.28); }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      background: transparent; overflow: hidden;
      font-family: Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .banner-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 5;
      min-height: 90px; max-height: 260px; overflow: hidden;
      border-radius: 14px; background: #f1f1f1;
    }
    .slide {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      opacity: 0; transition: opacity .45s ease; pointer-events: none;
    }
    .slide.active { opacity: 1; pointer-events: auto; }
    .slide img {
      display: block; width: 100%; height: 100%; object-fit: cover;
      border: 0; outline: 0;
    }
    .dots {
      position: absolute; z-index: 5; bottom: 8px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 7px;
      pointer-events: none;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--dot); border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .dot.active { background: var(--accent); width: 18px; border-radius: 8px; }
    .fallback {
      display: none; position: absolute; inset: 0; align-items: center;
      justify-content: center; color: #666; font-size: 13px; text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="banner-wrap" id="bannerWrap" aria-label="بنرهای سعادت">
    <div class="fallback" id="fallback">برای نمایش بنرها اتصال اینترنت را بررسی کنید.</div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

  <script>
    /*
      بنرها از این فایل خوانده می‌شوند:
      https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners.json

      برای تغییر بنرها، تصاویر را با همان نام‌های قبلی در پوشه banners جایگزین کنید:
      banner1.png ، banner2.png ، banner3.png
      در این صورت نیازی به انتشار نسخه جدید اپلیکیشن نیست.
    */
    const BANNERS_JSON =
      'https://raw.githubusercontent.com/sampixel1-ctrl/saadat-news/main/banners.json';

    const wrap = document.getElementById('bannerWrap');
    const dotsBox = document.getElementById('dots');
    const fallback = document.getElementById('fallback');
    let current = 0;
    let timer = null;
    let refreshTimer = null;
    let slides = [];
    let dots = [];
    let touchStartX = 0;

    function cacheBust(url) {
      try {
        const u = new URL(url);
        u.searchParams.set('_banner_refresh', Date.now().toString());
        return u.toString();
      } catch (_) {
        return url;
      }
    }

    function showSlide(index) {
      if (!slides.length) return;
      current = (index + slides.length) % slides.length;
      slides.forEach((el, i) => el.classList.toggle('active', i === current));
      dots.forEach((el, i) => el.classList.toggle('active', i === current));
    }

    function startRotation() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => showSlide(current + 1), 5000);
    }

    function renderBanners(data) {
      const urls = ['banner1', 'banner2', 'banner3']
        .map(key => data && data[key])
        .filter(url => typeof url === 'string' && /^https?:\/\//i.test(url));

      if (!urls.length) {
        if (!slides.length) fallback.style.display = 'flex';
        return;
      }

      // Avoid rebuilding the carousel if the JSON still contains the same URLs.
      const signature = urls.join('|');
      if (wrap.dataset.signature === signature && slides.length) {
        // Reload existing images with a cache-busting query to pick up replaced files.
        slides.forEach((slide, i) => {
          const img = slide.querySelector('img');
          img.src = cacheBust(urls[i]);
        });
        fallback.style.display = 'none';
        return;
      }

      if (timer) clearInterval(timer);
      slides.forEach(el => el.remove());
      dotsBox.innerHTML = '';
      slides = [];
      dots = [];
      current = 0;
      wrap.dataset.signature = signature;

      urls.forEach((url, i) => {
        const slide = document.createElement('a');
        slide.className = 'slide' + (i === 0 ? ' active' : '');
        slide.href = url;
        slide.target = '_blank';
        slide.rel = 'noopener noreferrer';
        slide.setAttribute('aria-label', 'بنر ' + (i + 1));

        const img = document.createElement('img');
        img.alt = 'بنر سعادت ' + (i + 1);
        img.loading = i === 0 ? 'eager' : 'lazy';
        img.src = cacheBust(url);
        img.onerror = () => {
          // Keep the carousel running if one image is temporarily unavailable.
          slide.style.background = '#eeeeee';
        };
        slide.appendChild(img);
        wrap.insertBefore(slide, dotsBox);
        slides.push(slide);

        const dot = document.createElement('span');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dotsBox.appendChild(dot);
        dots.push(dot);
      });

      fallback.style.display = 'none';
      startRotation();
    }

    async function loadBanners() {
      try {
        const response = await fetch(cacheBust(BANNERS_JSON), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        renderBanners(data);
      } catch (error) {
        if (!slides.length) fallback.style.display = 'flex';
      }
    }

    // Swipe support for touch screens.
    wrap.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    wrap.addEventListener('touchend', e => {
      const delta = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 35 && slides.length > 1) {
        showSlide(current + (delta < 0 ? 1 : -1));
        startRotation();
      }
    }, { passive: true });

    loadBanners();
    // Check the JSON periodically so updated banner URLs appear without an app update.
    refreshTimer = setInterval(loadBanners, 5 * 60 * 1000);
  </script>
</body>
</html>
